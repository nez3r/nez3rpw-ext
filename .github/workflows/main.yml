name: Builds

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # CMake builds for both architectures
  cmake-build-arm64:
    name: CMake build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r27d
        id: setup-ndk
      - name: Clean build directory
        run: rm -rf build-cmake-arm64
      - name: Configure CMake (arm64-v8a)
        run: |
          cmake -S . -B build-cmake-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build with CMake
        run: cmake --build build-cmake-arm64 -j$(nproc)
      - uses: actions/upload-artifact@v7
        with:
          name: cmake-arm64-v8a
          path: build-cmake-arm64/nez3r

  cmake-build-x86_64:
    name: CMake build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r27d
        id: setup-ndk
      - name: Clean build directory
        run: rm -rf build-cmake-x86_64
      - name: Configure CMake (x86_64)
        run: |
          cmake -S . -B build-cmake-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build with CMake
        run: cmake --build build-cmake-x86_64 -j$(nproc)
      - uses: actions/upload-artifact@v7
        with:
          name: cmake-x86_64
          path: build-cmake-x86_64/nez3r
